[package]
name = "amux"
version = "0.1.8"
edition = "2021"
description = "amux — tmux-like terminal multiplexer for coding agents (omp-first PTY wrap)"
license = "MIT"
publish = false

[[bin]]
name = "amux"
path = "src/main.rs"

[lib]
name = "amux"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
ratatui = "0.29"
crossterm = "0.28"
portable-pty = "0.9"
alacritty_terminal = "0.26.0"
signal-hook = "0.3"
nix = { version = "0.29", features = ["signal", "process", "term", "fs", "poll"] }
libc = "0.2"
parking_lot = "0.12"
dirs = "6"
notify = "6"
sha2 = "0.10"
unicode-width = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
